<div class="layout-wrapper">
  <aside class="layout-sidebar">
    <a routerLink="/productos" class="sidebar-brand">
      <i class="pi pi-shop"></i>
      <span>TP Taller</span>
    </a>

    <nav class="sidebar-nav">
      @for (item of menuItems(); track item.label) {
        <a
          [routerLink]="item.routerLink"
          routerLinkActive="active"
          class="sidebar-link"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    @if (authService.estaLogueado()) {
      <div class="sidebar-user">
        <p-divider />
        <p-button
          [label]="(authService.usuarioLogueado()?.nombre ?? '') | titlecase"
          icon="pi pi-user"
          severity="secondary"
          [text]="true"
          styleClass="user-menu-btn w-full"
          (onClick)="toggleUserMenu($event, userMenuRef)"
        />
        <p-menu #userMenuRef [model]="userMenuItems()" [popup]="true" />
      </div>
    }
  </aside>

  <div class="layout-main">
    <main class="layout-content">
      <router-outlet />
    </main>
    <footer class="layout-footer">
      <app-footer />
    </footer>
  </div>
</div>

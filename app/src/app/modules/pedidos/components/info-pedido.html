<p-card styleClass="mb-4">
  <ng-template #title>
    <div class="flex align-items-center justify-between gap-3 flex-wrap">
      <span>Pedido #{{ pedido().id }}</span>
      <p-tag [value]="pedido().estado" [severity]="estadoSeverity()" />
    </div>
  </ng-template>

  <ng-template #subtitle> Fecha: {{ pedido().fecha_creacion | date: 'short' }} </ng-template>

  <div *ngIf="pedido().productos.length === 0; else productosTable" class="empty-state py-8">
    <i class="pi pi-shopping-cart"></i>
    <p>No hay productos para mostrar.</p>
  </div>

  <ng-template #productosTable>
    <p-table [value]="pedido().productos" styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr>
          <th>Producto</th>
          <th>Precio unitario</th>
          <th>Cantidad</th>
          <th>Total</th>
          <th *ngIf="mostrarAccionesCarrito()" style="width: 10rem">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-producto>
        <tr>
          <td>
            <span class="font-semibold">{{ producto.nombre }}</span>
          </td>
          <td>{{ producto.precio | currency }}</td>
          <td>
            <p-tag [value]="producto.cantidad.toString()" severity="success" />
          </td>
          <td>{{ producto.subtotal | currency }}</td>
          <td *ngIf="mostrarAccionesCarrito()">
            <div class="flex gap-1">
              <p-button
                icon="pi pi-minus"
                severity="secondary"
                size="small"
                [rounded]="true"
                (onClick)="decrementarCantidad.emit(producto)"
              />
              <p-button
                icon="pi pi-plus"
                severity="secondary"
                size="small"
                [rounded]="true"
                (onClick)="incrementarCantidad.emit(producto)"
              />
              <p-button
                icon="pi pi-trash"
                severity="danger"
                size="small"
                [rounded]="true"
                [text]="true"
                (onClick)="quitarProducto.emit(producto)"
              />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </ng-template>

  <div class="pedido-total">
    <span>Total:</span>
    <span class="text-primary">{{ pedido().precio_total | currency }}</span>
  </div>

  <div
    *ngIf="mostrarAccionesPedido() && pedido().estado === EstadoPedido.PENDIENTE"
    class="action-bar"
  >
    <p-button
      label="Pagar"
      icon="pi pi-credit-card"
      severity="success"
      (onClick)="pagarPedido.emit(pedido())"
    />
    <p-button
      label="Cancelar"
      icon="pi pi-times"
      severity="danger"
      (onClick)="cancelarPedido.emit(pedido())"
    />
  </div>
</p-card>

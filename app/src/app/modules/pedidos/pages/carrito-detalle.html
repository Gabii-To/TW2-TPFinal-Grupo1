<div class="page-container">
  <h1 class="page-title">Carrito de Compras</h1>

  @if (cargando()) {
    <div class="flex justify-center py-12">
      <p-progress-spinner ariaLabel="Cargando carrito" />
    </div>
  } @else if (pedido(); as carrito) {
    <app-info-pedido
      [pedido]="carrito"
      [mostrarAccionesCarrito]="true"
      (incrementarCantidad)="incrementarCantidad($event)"
      (decrementarCantidad)="decrementarCantidad($event)"
      (quitarProducto)="quitarProducto($event)"
    />

    <div class="action-bar">
      <p-button
        label="Vaciar carrito"
        icon="pi pi-trash"
        severity="secondary"
        [disabled]="carrito.productos.length === 0"
        (onClick)="vaciarCarrito()"
      />
      <p-button
        label="Finalizar Compra"
        icon="pi pi-check"
        [disabled]="carrito.productos.length === 0"
        (onClick)="finalizarCompra()"
      />
    </div>
  }
</div>

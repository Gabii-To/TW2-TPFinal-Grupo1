<div class="container mx-auto p-6">
  <h1 class="text-3xl font-bold mb-6 text-gray-800">
    Pedidos
  </h1>

  @if (cargando()) {
    <p class="text-gray-500">Cargando pedidos...</p>
  } @else if (pedidos().length === 0) {
    <p class="text-gray-500">No hay pedidos para mostrar.</p>
  } @else {
    @for (pedido of pedidos(); track pedido.id) {
      <app-info-pedido
        [pedido]="pedido"
        [mostrarAccionesPedido]="true"
        (pagarPedido)="pagarPedido($event)"
        (cancelarPedido)="cancelarPedido($event)">
      </app-info-pedido>
    }
  }
</div>

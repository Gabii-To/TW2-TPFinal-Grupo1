<div class="min-h-screen bg-gray-100 py-10">
  <div class="mx-auto max-w-3xl px-4">

    <h1 class="mb-8 text-3xl font-bold text-gray-800">
      Mi Perfil
    </h1>
    @if (usuario(); as u) {
      <!-- Datos personales -->
      <div class="mb-8 rounded-xl bg-white p-6 shadow">

        <h2 class="mb-6 text-xl font-semibold text-gray-700">
          Datos personales
        </h2>

        <div class="grid gap-5 md:grid-cols-2">

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-600">
              Nombre
            </label>
            <input
              type="text"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none"
              [(ngModel)]="u.nombre">
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-600">
              Apellido
            </label>
            <input
              type="text"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none"
              [(ngModel)]="u.apellido">
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-600">
              Email
            </label>
            <input
              type="email"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none"
              [(ngModel)]="u.email">
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-600">
              Dirección
            </label>
            <input
              type="text"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none"
              [(ngModel)]="u.direccion">
          </div>

        </div>

        <div class="mt-6 flex justify-between">

          <button (click)="eliminarCuenta()"
            class="rounded-lg bg-red-600 px-5 py-2 font-medium text-white transition hover:bg-red-700">
            Eliminar cuenta
          </button>

          <button (click)="guardarCambios()"
                  class="rounded-lg bg-blue-600 px-6 py-2 font-medium text-white transition hover:bg-blue-700">
            Guardar cambios
          </button>
        </div>

      </div>

      <!-- Contraseña -->
      <div class="rounded-xl bg-white p-6 shadow">

        <h2 class="mb-6 text-xl font-semibold text-gray-700">
          Seguridad
        </h2>

        <div class="space-y-5">

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-600">
              Contraseña actual
            </label>
            <input [(ngModel)]="passwordActual"
                   type="password"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-600">
              Nueva contraseña
            </label>
            <input [(ngModel)]="passwordNuevo"
                   type="password"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-600">
              Confirmar contraseña
            </label>
            <input [(ngModel)]="confirmarPassword"
                   type="password"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none">
          </div>

        </div>

        <div class="mt-6 flex justify-between">

          <button (click)="cambiarPassword()"
                  class="rounded-lg bg-green-600 px-6 py-2 font-medium text-white transition hover:bg-green-700">
            Cambiar contraseña
          </button>

        </div>

      </div>
    }
  </div>
</div>

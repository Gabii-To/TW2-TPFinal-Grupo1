<div class="container mx-auto p-6 max-w-3xl">

  <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8">

    <h1 class="text-3xl font-bold text-gray-800 mb-8">
      Crear Producto
    </h1>

    <form class="space-y-6"
    (ngSubmit)="guardar()">

    @if (formError) {
    <div class="mb-4 p-3 rounded-lg bg-red-100 text-red-700 border border-red-300">
      {{ formError }}
    </div>
    }
    
      <div>
        <label
          for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
          Nombre <span class="text-red-500">*</span>
        </label>

        <input
          id="nombre"
          type="text"
          [(ngModel)]="producto.nombre"
          name="nombre"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          placeholder="Nombre del producto">
      </div>

      <div>
        <label
          for="descripcion"
          class="block text-sm font-medium text-gray-700 mb-2">
          Descripción<span class="text-red-500">*</span>
        </label>

        <textarea
          id="descripcion"
          name="descripcion"
          [(ngModel)]="producto.descripcion"
          rows="5"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          placeholder="Describe el producto..."></textarea>
      </div>

      <div>
        <label
          for="imagenes"
          class="block text-sm font-medium text-gray-700 mb-2">
          Imágenes
        </label>

        <input
          id="imagenes"
          type="file"
          accept="image/*"
          multiple
          (change)="onImagenesSeleccionadas($event)"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">

        @if (producto.imagenes.length > 0) {
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">
            @for (imagen of producto.imagenes; track $index) {
              <div class="relative border border-gray-200 rounded-lg overflow-hidden bg-gray-50">
                <img
                  [src]="imagenSrc(imagen)"
                  [alt]="'Imagen ' + ($index + 1) + ' de ' + producto.nombre"
                  class="w-full aspect-square object-cover">

                <button
                  type="button"
                  class="absolute top-2 right-2 bg-white/90 hover:bg-red-100 text-red-700 h-8 w-8 rounded-full shadow"
                  (click)="eliminarImagen($index)">
                  x
                </button>
              </div>
            }
          </div>
        }
      </div>

      <div class="grid md:grid-cols-2 gap-6">

        <div>
          <label
            for="clasificacion"
            class="block text-sm font-medium text-gray-700 mb-2">
            Clasificación<span class="text-red-500">*</span>
          </label>

          <select
            id="clasificacion"
            [(ngModel)]="producto.clasificacion"
            name="clasificacion"
            class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="">Seleccione una categoría</option>
                <option>Tecnología</option>
                <option>Hogar</option>
                <option>Deportes</option>
                <option>Ropa</option>
                <option>Otros</option>
          </select>
        </div>

        <div>
          <label
            for="precio"
            class="block text-sm font-medium text-gray-700 mb-2">
            Precio<span class="text-red-500">*</span>
          </label>

          <input
            id="precio"
            type="number"
            name="precio"
            [(ngModel)]="producto.precio"
            min="0"
            step="0.01"
            class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            placeholder="$0.00">
        </div>

        <input 
        hidden
        [(ngModel)]="producto.usuario_id"
        type="number"
        value="0"
        name="usuario_id">

      </div>
      <div class="flex justify-between pt-6">

        <button
          type="button"
          [routerLink]="['/productos']"
          class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-2 rounded-lg transition">
          Volver
        </button>

        <button
          type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition">
          Crear Producto
        </button>

      </div>

    </form>

  </div>

</div>

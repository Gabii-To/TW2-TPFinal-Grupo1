<div class="page-container">
  <p-card header="Crear Producto" styleClass="max-w-3xl mx-auto">
    <form (ngSubmit)="guardar()">
      @if (formError) {
        <p-message severity="error" [text]="formError" styleClass="w-full mb-4" />
      }

      <div class="field">
        <label for="nombre">Nombre <span class="text-red-500">*</span></label>
        <input
          pInputText
          id="nombre"
          type="text"
          [(ngModel)]="producto.nombre"
          name="nombre"
          placeholder="Nombre del producto"
          class="w-full"
        />
      </div>

      <div class="field">
        <label for="descripcion">Descripción <span class="text-red-500">*</span></label>
        <textarea
          pTextarea
          id="descripcion"
          name="descripcion"
          [(ngModel)]="producto.descripcion"
          rows="5"
          placeholder="Describe el producto..."
          class="w-full"
        ></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="field">
          <label for="clasificacion">Clasificación <span class="text-red-500">*</span></label>
          <p-select
            inputId="clasificacion"
            [(ngModel)]="producto.clasificacion"
            name="clasificacion"
            [options]="categorias"
            placeholder="Seleccione una categoría"
            styleClass="w-full"
          />
        </div>

        <div class="field">
          <label for="precio">Precio <span class="text-red-500">*</span></label>
          <p-inputnumber
            inputId="precio"
            [(ngModel)]="producto.precio"
            name="precio"
            mode="currency"
            currency="USD"
            locale="en-US"
            [min]="0"
            styleClass="w-full"
          />
        </div>

        <input hidden [(ngModel)]="producto.usuario_id" type="number" name="usuario_id" />
      </div>

      <div class="action-bar">
        <p-button
          label="Volver"
          icon="pi pi-arrow-left"
          severity="secondary"
          type="button"
          [routerLink]="['/productos']"
        />
        <p-button
          type="submit"
          label="Crear Producto"
          icon="pi pi-check"
          [loading]="submitting"
        />
      </div>
    </form>
  </p-card>
</div>

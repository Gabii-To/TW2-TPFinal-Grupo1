@if (producto(); as p) {
  <div class="page-container">
    <p-card>
      <ng-template #title>
        <div class="flex align-items-center justify-between gap-3 flex-wrap">
          <span>{{ p.nombre }}</span>
          <p-tag [value]="p.clasificacion" severity="info" />
        </div>
      </ng-template>

      <ng-template #subtitle>
        Producto #{{ p.id }}
      </ng-template>

      <div class="mb-4">
        <h3 class="text-lg font-semibold mb-2 m-0">Descripción</h3>
        <p class="text-muted-color m-0 leading-relaxed">{{ p.descripcion }}</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="surface-100 border-round p-4">
          <p class="text-sm text-muted-color m-0 mb-1">Precio</p>
          <p class="text-3xl font-bold text-green-600 m-0">{{ p.precio | currency }}</p>
        </div>
        <div class="surface-100 border-round p-4">
          <p class="text-sm text-muted-color m-0 mb-1">Vendedor</p>
          <p class="text-lg font-semibold m-0">Usuario #{{ p.usuario_id }}</p>
        </div>
      </div>

      <ng-template #footer>
        <div class="flex justify-between gap-3 flex-wrap">
          <p-button
            label="Volver"
            icon="pi pi-arrow-left"
            severity="secondary"
            [routerLink]="['/productos']"
          />
          <p-button
            label="Agregar al carrito"
            icon="pi pi-shopping-cart"
            (onClick)="agregarAlCarrito(p)"
          />
        </div>
      </ng-template>
    </p-card>
  </div>
}

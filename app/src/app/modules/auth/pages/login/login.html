<div class="min-h-screen flex items-center justify-center bg-slate-100">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-3xl font-bold text-center text-slate-800 mb-6">Iniciar sesión</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1"> Email </label>

        <input
          type="email"
          formControlName="email"
          placeholder="correo@ejemplo.com"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <p class="text-red-500 text-sm mt-1">Ingresá un email válido</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1"> Contraseña </label>

        <input
          type="password"
          formControlName="password"
          placeholder="********"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <p class="text-red-500 text-sm mt-1">La contraseña es obligatoria</p>
        }
      </div>

      <div class="d-grid gap-2 mt-1/2">
        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition disabled:bg-slate-400"
        >
          Ingresar
        </button>
      </div>

      <div class="text-center mt-1">
        <p class="text-muted small mt-0 mb-0">
          ¿No tenés cuenta?
          <a
            [routerLink]="['/registro']"
            class="text-primary fw-bold text-decoration-none ms-1-custom"
          >
            Registrate acá
          </a>
        </p>
      </div>
    </form>
  </div>
</div>

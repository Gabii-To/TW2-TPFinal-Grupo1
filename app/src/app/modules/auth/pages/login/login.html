<div class="auth-page">
  <p-card styleClass="auth-card">
    <ng-template #header>
      <div class="auth-header">
        <i class="pi pi-sign-in auth-icon"></i>
        <h1>Iniciar sesión</h1>
      </div>
    </ng-template>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      @if (formError) {
        <p-message severity="error" [text]="formError" styleClass="w-full mb-4" />
      }

      <div class="field">
        <label for="email">Email</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          placeholder="correo@ejemplo.com"
          class="w-full"
        />
        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <small class="p-error">Ingresá un email válido</small>
        }
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <p-password
          inputId="password"
          formControlName="password"
          placeholder="********"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <small class="p-error">La contraseña es obligatoria</small>
        }
      </div>

      <p-button
        type="submit"
        label="Ingresar"
        icon="pi pi-sign-in"
        [loading]="submitting"
        styleClass="w-full"
      />

      <p-divider />

      <p class="text-center m-0">
        ¿No tenés cuenta?
        <a routerLink="/auth/register" class="text-primary font-semibold no-underline ml-1">
          Registrate acá
        </a>
      </p>
    </form>
  </p-card>
</div>

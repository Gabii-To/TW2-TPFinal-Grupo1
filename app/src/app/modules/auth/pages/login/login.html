<div class="min-h-[70vh] flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-xl shadow-lg p-8">
    <div class="text-center mb-8">
      <div class="mx-auto mb-3 h-12 w-12 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center">
        <i class="pi pi-sign-in text-xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-800">Iniciar sesión</h1>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      @if (formError) {
        <div class="rounded-lg bg-red-100 text-red-700 border border-red-300 px-4 py-3">
          {{ formError }}
        </div>
      }

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="correo@ejemplo.com"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">

        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <small class="text-red-600 mt-1 block">Ingresá un email válido</small>
        }
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Contraseña
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="********"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">

        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <small class="text-red-600 mt-1 block">La contraseña es obligatoria</small>
        }
      </div>

      <button
        type="submit"
        [disabled]="submitting"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-semibold px-6 py-2 rounded-lg transition">
        @if (submitting) {
          Ingresando...
        } @else {
      <div class="d-grid gap-2 mt-1/2">
        <div class="text-right mt-2">
    <a [routerLink]="['/auth/recuperar-clave']" class="text-sm text-blue-600 hover:underline">
       ¿Olvidaste tu contraseña? </a>
    </div>
        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition disabled:bg-slate-400 pointer"
        >
          Ingresar
        }
      </button>

      <div class="border-t border-gray-200 pt-5 text-center">
        <p class="m-0 text-gray-600">
          ¿No tenés cuenta?
          <a routerLink="/auth/register" class="text-blue-700 font-semibold no-underline ml-1">
            Registrate acá
          </a>
        </p>
      </div>
    </form>
  </div>
</div>

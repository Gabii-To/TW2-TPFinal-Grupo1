<div class="min-h-screen flex items-center justify-center bg-slate-100">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <h1 class="text-lg font-semibold text-center text-slate-800 mb-4">
      Recuperar contraseña
    </h1>

    <form [formGroup]="recuperarClaveForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="correo@ejemplo.com"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/>

        @if (recuperarClaveForm.get('email')?.invalid && recuperarClaveForm.get('email')?.touched) {
          <p class="text-red-500 text-sm mt-1">Ingresá un email válido</p>
        }
      </div>

      <div class="text-center mt-1 flex gap-4">
        <button
          type="submit"
          [disabled]="recuperarClaveForm.invalid"
          class="flex-1 bg-blue-700 text-white px-4 py-3 rounded-lx hover:bg-blue-700 transition disabled:bg-sky-800/50 pointer">
          Enviar email
        </button>
        <button
          type="button"
          class="flex-1 bg-red-700 text-white px-4 py-3 rounded-lx hover:bg-orange-600 transition pointer"
          [routerLink]="['/login']">
          Volver
        </button>
      </div>
    </form>
  </div>
</div>

<div class="min-h-screen flex items-center justify-center bg-gray-100">

  <div class="w-full max-w-md bg-white p-8 rounded-xl shadow">

    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">
      Crear cuenta
    </h1>

    <!-- Nombre -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-600">Nombre</label>
      <input
        [(ngModel)]="usuario.nombre"
        type="text"
        class="w-full mt-1 px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
    </div>

    <!-- Apellido -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-600">Apellido</label>
      <input
        [(ngModel)]="usuario.apellido"
        type="text"
        class="w-full mt-1 px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
    </div>

    <!-- Email -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-600">Email</label>
      <input
        [(ngModel)]="usuario.email"
        type="email"
        class="w-full mt-1 px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
    </div>

    <!-- Dirección -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-600">Dirección</label>
      <input
        [(ngModel)]="usuario.direccion"
        type="text"
        class="w-full mt-1 px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
    </div>

    <!-- Password -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-600">Contraseña</label>
      <input
        [(ngModel)]="usuario.password"
        type="password"
        class="w-full mt-1 px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
    </div>

    <!-- Botón -->
    <button
      (click)="registrar()"
      class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
      Registrarse
    </button>

    <p class="text-sm text-center mt-4 text-gray-600">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-blue-600 hover:underline">
        Inicia sesión
      </a>
    </p>

  </div>

</div>
<p>signup works!</p>
